<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Пособия мамам</title>
<script src="https://st.max.ru/js/max-web-app.js"></script>
<script>
/* =========================================================
   МЕНЯЕТЕ ТОЛЬКО ЭТОТ БЛОК
   Все тексты, ссылки и цвета приложения — здесь.
   ========================================================= */
window.KK_DATA = {
  colors: {
    bg: "#FFF7F1",      // фон приложения и шапки Телеграма
    accent: "#E26D5A",  // акцентный цвет (кнопки, номера, стрелки)
    text: "#2A211E"     // основной цвет текста
  },
  header: {
    label: "Пособия мамам",
    titleLine1: "Единое пособие",
    titleLine2: "без ошибок",
    description: "Записи бесплатных эфиров юриста Екатерины Рыдченко. Посмотрите их, а затем разберите единое пособие целиком на интенсиве."
  },
  hero: {
    badge: "Интенсив",
    title: "Единое пособие: от А до Я",
    text: "Разберём всё, что влияет на назначение пособия: доходы, имущество, счета и алименты. Вы поймёте, как подать заявление без ошибок и что делать, если пришёл отказ.",
    buttonText: "Участвовать в интенсиве",
    buttonUrl: "https://max.ru/channel_posobia_mamam/AaGQ3MjuJow"
  },
  cardsTitle: "Смотрите по порядку",
  cards: [
    {
      tag: "Бесплатный эфир",
      title: "Движение по счетам",
      caption: "Как учитываются поступления на счета при назначении единого пособия",
      url: "https://max.ru/channel_posobia_mamam/AaGBr93zFdE"
    },
    {
      tag: "Бесплатный эфир",
      title: "Условные алименты",
      caption: "Что это такое и как они влияют на единое пособие",
      url: "https://max.ru/channel_posobia_mamam/AaGNtduGFJg"
    },
    {
      tag: "Интенсив",
      title: "Единое пособие: от А до Я",
      caption: "Полный разбор пособия — от права на выплату до подачи заявления",
      url: "https://max.ru/channel_posobia_mamam/AaGQ3MjuJow",
      highlight: true
    }
  ],
  footer: {
    name: "Екатерина Рыдченко, юрист",
    school: "Пособия мамам"
  }
};
/* ================= КОНЕЦ БЛОКА ДЛЯ ИЗМЕНЕНИЙ ================= */
</script>
<style>
  :root {
    --bg: #FFF7F1;
    --accent: #E26D5A;
    --text: #2A211E;
    --muted: rgba(42, 33, 30, 0.6);
    --card: #FFFFFF;
    --line: rgba(42, 33, 30, 0.08);
    --soft: rgba(226, 109, 90, 0.12);
    --font-head: "Unbounded", "Montserrat", "Arial Rounded MT Bold", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-text: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: var(--font-text);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(40px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom));
  }

  /* Шапка */
  .label {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--soft);
    padding: 7px 12px;
    border-radius: 100px;
    margin-bottom: 20px;
  }
  .title {
    font-family: var(--font-head);
    font-weight: 800;
    font-size: clamp(32px, 9.5vw, 46px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
    word-break: break-word;
  }
  .title span { display: block; }
  .title span:last-child { color: var(--accent); }
  .desc { color: var(--muted); font-size: 16px; max-width: 470px; }

  /* Главный блок */
  .hero {
    margin-top: 32px;
    background: var(--accent);
    color: #fff;
    border-radius: 28px;
    padding: 26px 22px 22px;
    box-shadow: 0 18px 40px -20px rgba(226, 109, 90, 0.7);
  }
  .hero-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    background: rgba(255, 255, 255, 0.2);
    padding: 6px 11px;
    border-radius: 100px;
    margin-bottom: 14px;
  }
  .hero h2 {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 24px;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin-bottom: 12px;
  }
  .hero p { font-size: 15px; line-height: 1.5; opacity: 0.92; margin-bottom: 22px; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    background: #fff;
    color: var(--text);
    font-family: var(--font-head);
    font-weight: 600;
    font-size: 15px;
    padding: 18px 20px 18px 22px;
    border-radius: 18px;
    transition: transform .15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn svg { flex-shrink: 0; color: var(--accent); }

  /* Карточки */
  .section-title {
    margin: 40px 0 14px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .cards { display: flex; flex-direction: column; gap: 10px; list-style: none; }
  .card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 18px 16px 18px 18px;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .card:hover { border-color: rgba(226, 109, 90, 0.35); box-shadow: 0 10px 24px -16px rgba(42, 33, 30, 0.35); }
  .card:active { transform: scale(0.985); }
  .card.is-main { border: 2px solid var(--accent); }
  .num {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 14px;
    color: var(--accent);
    background: var(--soft);
  }
  .card.is-main .num { background: var(--accent); color: #fff; }
  .card-body { flex: 1; min-width: 0; }
  .card-tag {
    display: block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 3px;
  }
  .card-title {
    display: block;
    font-family: var(--font-head);
    font-weight: 600;
    font-size: 16px;
    line-height: 1.25;
    margin-bottom: 4px;
  }
  .card-caption { display: block; font-size: 13px; color: var(--muted); line-height: 1.4; }
  .arrow {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    background: var(--soft);
    transition: background .15s ease, color .15s ease;
  }
  .card:hover .arrow, .card.is-main .arrow { background: var(--accent); color: #fff; }

  /* Подвал */
  .footer {
    margin-top: 44px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px 12px;
    flex-wrap: wrap;
    font-size: 13px;
    color: var(--muted);
  }
  .footer strong { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="label" id="kk-label"></div>
    <h1 class="title" id="kk-title"></h1>
    <p class="desc" id="kk-desc"></p>
  </header>

  <section class="hero">
    <span class="hero-badge" id="kk-hero-badge"></span>
    <h2 id="kk-hero-title"></h2>
    <p id="kk-hero-text"></p>
    <a class="btn" id="kk-hero-btn" href="#" data-url=""></a>
  </section>

  <div class="section-title" id="kk-cards-title"></div>
  <ul class="cards" id="kk-cards"></ul>

  <footer class="footer">
    <strong id="kk-name"></strong>
    <span id="kk-school"></span>
  </footer>
</div>

<script>
(function () {
  var D = window.KK_DATA || {};
  var C = D.colors || {};
  var BG = C.bg || "#FFF7F1";
  var root = document.documentElement.style;

  /* ---------- Цвета ---------- */
  root.setProperty("--bg", BG);
  if (C.accent) root.setProperty("--accent", C.accent);
  if (C.text) root.setProperty("--text", C.text);

  /* ---------- Определяем MAX ---------- */
  var w = window;
  var wa = w.WebApp || null;

  /* В обычном браузере скрипт MAX тоже грузится, но поля пустые.
     Считаем, что мы внутри MAX, только если заполнено хотя бы одно поле. */
  function hasValue(v) {
    if (v == null) return false;
    if (typeof v === "string") return v.trim() !== "";
    if (typeof v === "object") { for (var k in v) { return true; } return false; }
    return true;
  }
  var IN_MAX = !!wa && (
    hasValue(wa.initData) ||
    hasValue(wa.platform) ||
    hasValue(wa.version) ||
    !!(wa.initDataUnsafe && hasValue(wa.initDataUnsafe.user))
  );

  function call(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    try {
      if (wa && typeof wa[name] === "function") { wa[name].apply(wa, args); return true; }
    } catch (e) {}
    return false;
  }

  /* ---------- Запуск ---------- */
  if (IN_MAX) {
    call("ready");
    call("expand");
    call("setHeaderColor", BG);
    call("setBackgroundColor", BG);
  }

  /* ---------- Утилиты ---------- */
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  var ARROW = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var TARGET = IN_MAX ? "_self" : "_blank";

  function setLink(a, url) {
    a.setAttribute("href", url || "#");
    a.setAttribute("data-url", url || "");
    a.setAttribute("target", TARGET);
    if (!IN_MAX) a.setAttribute("rel", "noopener");
  }

  /* ---------- Разметка из KK_DATA ---------- */
  var H = D.header || {};
  $("kk-label").textContent = H.label || "";
  var t = $("kk-title");
  t.appendChild(el("span", null, H.titleLine1 || ""));
  t.appendChild(el("span", null, H.titleLine2 || ""));
  $("kk-desc").textContent = H.description || "";
  if (H.label) document.title = H.label;

  var HE = D.hero || {};
  var badge = $("kk-hero-badge");
  if (HE.badge) badge.textContent = HE.badge; else badge.style.display = "none";
  $("kk-hero-title").textContent = HE.title || "";
  $("kk-hero-text").textContent = HE.text || "";
  var btn = $("kk-hero-btn");
  btn.appendChild(el("span", null, HE.buttonText || "Открыть"));
  btn.insertAdjacentHTML("beforeend", ARROW);
  setLink(btn, HE.buttonUrl);

  var ct = $("kk-cards-title");
  if (D.cardsTitle) ct.textContent = D.cardsTitle; else ct.style.display = "none";

  var list = $("kk-cards");
  (D.cards || []).forEach(function (c, i) {
    var li = el("li");
    var a = el("a", "card" + (c.highlight ? " is-main" : ""));
    setLink(a, c.url);
    a.appendChild(el("span", "num", (i + 1 < 10 ? "0" : "") + (i + 1)));
    var body = el("span", "card-body");
    if (c.tag) body.appendChild(el("span", "card-tag", c.tag));
    body.appendChild(el("span", "card-title", c.title || ""));
    if (c.caption) body.appendChild(el("span", "card-caption", c.caption));
    a.appendChild(body);
    var arr = el("span", "arrow");
    arr.innerHTML = ARROW;
    a.appendChild(arr);
    li.appendChild(a);
    list.appendChild(li);
  });

  var F = D.footer || {};
  $("kk-name").textContent = F.name || "";
  $("kk-school").textContent = F.school || "";

  /* ---------- Открытие ссылок ---------- */
  function openUrl(url) {
    var isMaxLink = url.indexOf("https://max.ru/") === 0;

    if (isMaxLink) {
      /* Сначала открываем ссылку MAX, сразу после — закрываем приложение */
      if (!call("openMaxLink", url)) { w.location.href = url; return; }
      call("close");
    } else {
      if (!call("openLink", url)) w.open(url, "_blank");
    }
  }

  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a[data-url]") : null;
    if (!a) return;
    var url = a.getAttribute("data-url");
    if (!url) { e.preventDefault(); return; }
    if (!IN_MAX) return; /* в обычном браузере ссылка открывается сама */
    e.preventDefault();
    openUrl(url);
  });
})();
</script>
</body>
</html>
